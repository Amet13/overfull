# overfull.yml — configuration for the `overfull` CLI (build, check, diff ...).
# Docs: https://github.com/amet13/overfull
main: main.tex
jobname: thesis            # output: thesis.pdf / thesis.log
bib: [references.bib]
profile: thesis
checks: [build, output, references, accessibility, venue]
references:
  # Your e-mail lets CrossRef/OpenAlex put you in their faster "polite pool".
  # mailto: you@example.org
  ignore: []
  # A cited entry must verify against the indexes, come from `overfull cite`
  # (which adds x-overfull = {cite ...}), or carry note = {overfull: author-provided}
  # written by you. Set to false if you never work with an AI agent.
  requireCite: true
venue:
  # Page limit for the main matter (up to \label{overfull:main-end}).
  # pageLimit: { max: 80, endLabel: overfull:main-end }
  anonymous: false
  # AI-use statement (chapters/ai-disclosure.tex): reported while missing or a
  # placeholder. Set to required if your university asks for one, off if not.
  disclosure: recommended
build:
  engine: auto             # local latexmk if installed, otherwise Docker
  image: ghcr.io/amet13/overfull:3-slim  # the image CI builds with; :3 is all of TeX Live
