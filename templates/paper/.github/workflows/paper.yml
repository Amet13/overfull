# Build the PDF in the Overfull image, run the preflight and publish results.
# Push: PDF artifact + job summary. Pull request: also a PDF of the changes.
# Uses ghcr.io/amet13/overfull:3-slim: TeX Live's basic scheme plus what this template
# needs (about a fifth of the full image); `overfull build` installs anything else it lacks.
name: paper

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/amet13/overfull:3-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for `overfull diff`
          persist-credentials: false

      # The job runs as root in the image while the checkout belongs to the
      # runner user: let git (used by `overfull diff`) trust this one directory.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: overfull build

      # arXiv only runs pdfLaTeX: make sure that build works too.
      - name: Build with pdfLaTeX (arXiv)
        run: latexmk -pdf -jobname=paper-arxiv

      # One run: annotations on the changed lines, the report in the job summary and
      # as a shareable HTML page; its exit code sets the job status.
      - name: Preflight
        run: overfull check --annotations --write markdown="$GITHUB_STEP_SUMMARY" --write html=overfull-report.html

      - name: Diff against base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: overfull diff --base "origin/$BASE_REF"

      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf
          path: |
            *.pdf
            *.log
            overfull-report.html
          if-no-files-found: warn
