version: 2
updates:
  - package-ecosystem: "github-actions"
    directories: ["/", "/templates/thesis", "/templates/paper", "/templates/slides"]
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait before proposing a new version: a hijacked release is usually found and
    # pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directories: ["/", "/docker/pnpm"]
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      # astro check (site) does not support TypeScript 7 yet; review majors by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # pnpm is pinned twice (packageManager and docker/pnpm) and must match;
      # maintenance.yml (update-pins) bumps both together.
      - dependency-name: "pnpm"
    groups:
      npm:
        patterns: ["*"]
