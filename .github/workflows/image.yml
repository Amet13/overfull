name: image

# ghcr.io/amet13/overfull, built natively for linux/amd64 and linux/arm64 and
# merged into one multi-arch tag:
#   tag vX.Y.Z → X.Y.Z, X.Y, X (what templates and the Makefiles use: :3)
#   main       → edge
#   every push → sha-<short>
#   release.yml (workflow_call with `version`) → sha-<short> only, labelled with the
#   version: release.yml adds the version tags itself, after its approval, right
#   before it creates the release (the same as for images main already built)
# A second, much smaller image without TeX Live (CLI, veraPDF, poppler, git)
# gets the same tags with a "-check" suffix: 3.1.0-check, 3.1-check, 3-check,
# edge-check, sha-<short>-check. A third, "-slim" (3.1.0-slim, 3-slim, ...), is TeX
# Live's basic scheme plus what most papers and the templates use; it installs other
# packages on demand. It is also tagged "-medium", the name of the image it replaced.
# Each build is signed with a build provenance attestation.
#
# edge and sha-<short> are what people pull between releases, so they are published only
# for a commit ci passed on: the ci-passed job waits for ci's verdict on this commit while
# the images build (ci is the shorter of the two). Waiting here is simpler than having ci
# start this workflow, and keeps the path filters below; release builds skip it, because
# release.yml checks ci itself.

on:
  push:
    branches: [main]
    # On main, only changes that reach the image rebuild it (path filters do
    # not apply to tag pushes, so releases always build).
    paths:
      - "docker/**"
      - "packages/**"
      - "templates/**"
      - "skills/**"
      - "shared/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/image.yml"
    # Release tags only: moving the major tag (v3) for the Action triggers nothing.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
  # release.yml calls this when this commit's images are missing (main skipped or lost
  # them): a tag created by a workflow's GITHUB_TOKEN does not start other workflows.
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z) to tag the image with
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # A fixed prefix: when called from release.yml, github.workflow is "release".
  group: image-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  # Lowercase, as GHCR requires; templates and docs pull this exact name.
  IMAGE: ghcr.io/amet13/overfull

jobs:
  build:
    name: Build (${{ matrix.target == 'check' && 'check' || matrix.flavor }}, ${{ matrix.platform }})
    strategy:
      # One failed build (a CTAN mirror) does not cancel the others: their layers reach
      # the cache, so re-running the failed job is quick. Nothing is published unless
      # every build passed.
      fail-fast: false
      matrix:
        include:
          - { target: overfull, flavor: full, suffix: "", platform: linux/amd64, runner: ubuntu-26.04, pair: overfull-linux-amd64 }
          - { target: overfull, flavor: full, suffix: "", platform: linux/arm64, runner: ubuntu-26.04-arm, pair: overfull-linux-arm64 }
          - { target: check, flavor: full, suffix: -check, platform: linux/amd64, runner: ubuntu-26.04, pair: check-linux-amd64 }
          - { target: check, flavor: full, suffix: -check, platform: linux/arm64, runner: ubuntu-26.04-arm, pair: check-linux-arm64 }
          - { target: overfull, flavor: slim, suffix: -slim, platform: linux/amd64, runner: ubuntu-26.04, pair: slim-linux-amd64 }
          - { target: overfull, flavor: slim, suffix: -slim, platform: linux/arm64, runner: ubuntu-26.04-arm, pair: slim-linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version
        env:
          WANT: ${{ inputs.version || github.ref_name }}
        run: test "${WANT#v}" = "$(jq -r .version packages/cli/package.json)"
      - name: Labels for this image
        id: labels
        env:
          NAME: ${{ matrix.target == 'check' && 'check' || matrix.flavor }}
          VERSION: ${{ inputs.version && format('{0}{1}', inputs.version, matrix.suffix) || '' }}
        run: |
          { echo 'labels<<EOF'; bash .github/scripts/image-labels.sh "$NAME" "$VERSION"; echo EOF; } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main,enable=${{ !inputs.version }}
            type=sha
          flavor: |
            suffix=${{ matrix.suffix }}
          labels: ${{ steps.labels.outputs.labels }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version && format('{0}{1}', inputs.version, matrix.suffix) || steps.meta.outputs.version }}
            TEX_FLAVOR=${{ matrix.flavor }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.pair }}
          cache-to: type=gha,scope=${{ matrix.pair }},mode=max
      - name: The image runs the CLI
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "$IMAGE@$DIGEST" overfull --version
          docker run --rm "$IMAGE@$DIGEST" verapdf --version > /dev/null
      - name: The check image has no TeX Live and checks the fixture project
        if: matrix.target == 'check'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if docker run --rm "$IMAGE@$DIGEST" sh -c 'command -v lualatex || command -v pdflatex'; then
            echo "::error::the check image must not contain TeX Live"; exit 1
          fi
          set +e
          docker run --rm -v "$PWD/packages/cli/test/fixtures/project:/work" -w /work "$IMAGE@$DIGEST" overfull check --offline
          code=$?
          echo "overfull check exited with $code"
          # 0 (clean) and 1 (problems found) are fine; 2 is a failure to run.
          test "$code" -le 1
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  ci-passed:
    name: ci passed on this commit
    if: ${{ !inputs.version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    permissions:
      actions: read
    steps:
      - name: Wait for ci's verdict on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 1 90); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA" \
              --jq '[.workflow_runs[] | {status, conclusion}]')"
            if jq -e 'any(.[]; .conclusion == "success")' <<< "$runs" > /dev/null; then
              echo "ci passed on $SHA."; exit 0
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<< "$runs" > /dev/null; then
              echo "::error::ci did not pass on $SHA, so its images are not published."; exit 1
            fi
            sleep 30
          done
          echo "::error::ci has no verdict on $SHA after 45 minutes; the images are not published."
          exit 1

  publish:
    name: Publish (${{ matrix.name }})
    needs: [build, ci-passed]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.ci-passed.result == 'success' || needs.ci-passed.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: overfull, suffix: "" }
          - { name: check, suffix: -check }
          - { name: slim, suffix: -slim }
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Annotations for this image
        id: labels
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ inputs.version && format('{0}{1}', inputs.version, matrix.suffix) || '' }}
        run: |
          { echo 'labels<<EOF'; bash .github/scripts/image-labels.sh "$NAME" "$VERSION"; echo EOF; } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main,enable=${{ !inputs.version }}
            type=sha
          flavor: |
            suffix=${{ matrix.suffix }}
          annotations: ${{ steps.labels.outputs.labels }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r ann; do args+=(--annotation "$ann"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for d in *; do args+=("$IMAGE@sha256:$d"); done
          # The slim image also answers to the "-medium" tags of the image it replaced.
          if [ "${{ matrix.name }}" = slim ]; then
            while IFS= read -r tag; do args+=(-t "${tag%-slim}-medium"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          fi
          docker buildx imagetools create "${args[@]}"
          first="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$first"
          echo "digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
