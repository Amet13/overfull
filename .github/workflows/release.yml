name: release

# Tag vX.Y.Z → GitHub release with:
#   - overfull.cjs                      single-file CLI, runs with Node ≥ 26 on any OS
#   - overfull-<os>-<arch>[.exe]        native executables (Node single executable):
#                                       linux-x64, linux-arm64, darwin-arm64, darwin-x64, win-x64
#   - thesis.pdf, paper.pdf, slides.pdf template PDFs built in the Docker image
#   - SHA256SUMS                        checksums, plus build provenance attestations
#   - overfull.intoto.sigstore.json     the signed provenance (Sigstore bundle) for every file
#   - overfull.intoto.jsonl             the same provenance as an in-toto DSSE envelope (SLSA)
#
# Two ways to release the version in package.json (bump it first with
# scripts/bump-version.mjs):
#   - Actions → release → Run workflow on main, with "publish" ticked. It checks
#     that CI passed on that commit, builds everything, makes sure this commit's
#     images exist (built on main by image.yml, or built here), then, after the
#     `release` environment's approval, tags the images with the version, creates
#     the vX.Y.Z tag and release and moves the major tag (v3). Nothing is published
#     until everything it needs is built, so a failed run can simply run again.
#   - Or push a vX.Y.Z tag; image.yml then publishes the image itself. Both ways
#     check that ci passed on the commit.
# Run workflow without "publish" is a dry run from any branch: every asset is
# built and kept as a workflow artifact, nothing is published.

on:
  push:
    # Release tags only: moving the major tag (v3) for the Action triggers nothing.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (main only). Unticked = dry run.
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version and release checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Every package has the same version (and it matches the tag)
        run: |
          version="$(jq -r .version packages/cli/package.json)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, package version $version (run scripts/bump-version.mjs)"; exit 1
          fi
          for f in packages/core/package.json action/package.json; do
            got="$(jq -r .version "$f")"
            [ "$got" = "$version" ] || { echo "::error file=$f::version $got, expected $version (run scripts/bump-version.mjs)"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publishing is allowed
        if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::publish only from main (this run is on $GITHUB_REF_NAME)"; exit 1; }
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
              echo "::error::v$VERSION is already released; bump the version first (scripts/bump-version.mjs)"; exit 1
            fi
          fi
          # A merge made by automation starts ci with workflow_dispatch, not push.
          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA" --jq '[.workflow_runs[] | select(.conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | length')"
          [ "$ci" -gt 0 ] || { echo "::error::ci has not passed on $GITHUB_SHA yet; wait for it, then run again"; exit 1; }
          echo "Publishing v$VERSION from $GITHUB_SHA"

  pdfs:
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: overfull
          load: true
          tags: overfull:release
          cache-from: type=gha,scope=overfull-linux-amd64
      - run: bash scripts/e2e-templates.sh overfull:release out
      - name: Collect PDFs
        run: |
          mkdir -p assets
          cp out/thesis/thesis.pdf out/paper/paper.pdf out/slides/slides.pdf assets/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-pdfs
          path: assets/*

  cli:
    name: CLI (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, target: linux-x64 }
          - { os: ubuntu-26.04-arm, target: linux-arm64 }
          - { os: macos-26, target: darwin-arm64 }
          - { os: macos-26-intel, target: darwin-x64 }
          - { os: windows-2025, target: win-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # The executables embed this Node.js (26 LTS), which builds them in one
      # step with `--build-sea`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: node scripts/build-standalone.mjs --sea
      - name: Smoke test
        shell: bash
        run: |
          exe=dist-standalone/overfull; [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" explain undefined-control-sequence > /dev/null
          "$exe" init paper "$RUNNER_TEMP/sea-paper" --no-git > /dev/null
          test -f "$RUNNER_TEMP/sea-paper/main.tex"
          node dist-standalone/overfull.cjs --version
      - name: Name assets
        shell: bash
        run: |
          mkdir -p assets
          if [ -f dist-standalone/overfull.exe ]; then
            cp dist-standalone/overfull.exe "assets/overfull-${{ matrix.target }}.exe"
          else
            cp dist-standalone/overfull "assets/overfull-${{ matrix.target }}"
          fi
          # A gzip copy of each executable (about a third of the size): install.sh and
          # install.ps1 download it when SHA256SUMS lists it, and check both files.
          for f in assets/overfull-*; do gzip -9 -k -n "$f"; done
          if [ "${{ matrix.target }}" = linux-x64 ]; then cp dist-standalone/overfull.cjs assets/; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-cli-${{ matrix.target }}
          path: assets/*

  # This commit's three images (sha-<short>), which the release tags with its version.
  # image.yml builds them on main; while it is still running for this commit, wait for
  # it. When it is not running and they are missing (main skipped them, or the build
  # failed), they never come: the image job below builds them at once.
  images:
    name: Images for this commit
    if: inputs.publish
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      ready: ${{ steps.find.outputs.ready }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find or wait for them
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/amet13/overfull
        run: |
          sha="sha-${GITHUB_SHA::7}"
          for _ in $(seq 1 80); do
            # Asked before looking, so a build that ends in between is not missed.
            running="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/image.yml/runs?head_sha=$GITHUB_SHA" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
            missing=""
            for sfx in "" -check -slim; do
              docker buildx imagetools inspect "$IMAGE:$sha$sfx" > /dev/null 2>&1 || missing="$missing $sha$sfx"
            done
            if [ -z "$missing" ]; then
              echo "All three images exist for $sha."
              echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$running" -eq 0 ]; then
              echo "::notice::Missing:$missing, and image.yml is not running for this commit; building them."
              echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "image.yml is still running for this commit (missing:$missing); waiting."
            sleep 30
          done
          echo "::notice::image.yml did not finish in 40 minutes; building the images here."
          echo "ready=false" >> "$GITHUB_OUTPUT"

  image:
    if: inputs.publish && needs.images.outputs.ready != 'true'
    needs: [version, images]
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.version.outputs.version }}

  github-release:
    # Runs only once everything is built: the assets, and for Run workflow the images.
    needs: [version, pdfs, cli, images, image]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      needs.pdfs.result == 'success' && needs.cli.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (inputs.publish && needs.images.result == 'success' &&
        (needs.images.outputs.ready == 'true' || needs.image.result == 'success')))
    # Tags the images, creates the tag and release and moves v3. Add a required reviewer
    # under Settings → Environments → release to approve each publish (MAINTAINING.md).
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          merge-multiple: true
          path: assets
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS
      - name: Homebrew formula and Scoop manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node src/packaging/generate.mjs --version "$VERSION" --sums assets/SHA256SUMS --out assets
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      # Also ship the signed provenance as a release file, so it can be checked
      # offline (`gh attestation verify --bundle`) and found by OpenSSF Scorecard.
      - name: Attach the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" assets/overfull.intoto.sigstore.json
          # The in-toto envelope on its own line, the format SLSA tooling and OpenSSF
          # Scorecard (Signed-Releases) recognise as provenance.
          jq -c '.dsseEnvelope' "$BUNDLE" > assets/overfull.intoto.jsonl
          test -s assets/overfull.intoto.jsonl
      # The images of this commit (the same platform images, no rebuild) get the version
      # tags, before the release exists. Their index says which version they are: images
      # built on main are labelled "edge". A new index has a new digest, so it is attested.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.publish
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag this commit's images with the release version
        id: retag
        if: inputs.publish
        env:
          IMAGE: ghcr.io/amet13/overfull
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sha="sha-${GITHUB_SHA::7}"
          major="${VERSION%%.*}"; minor="${VERSION%.*}"
          for name in full check slim; do
            sfx="-$name"; [ "$name" = full ] && sfx=""
            args=(-t "$IMAGE:$VERSION$sfx" -t "$IMAGE:$minor$sfx" -t "$IMAGE:$major$sfx")
            if [ "$name" = slim ]; then
              args+=(-t "$IMAGE:$VERSION-medium" -t "$IMAGE:$minor-medium" -t "$IMAGE:$major-medium")
            fi
            while IFS= read -r label; do args+=(--annotation "index:$label"); done \
              < <(bash src/.github/scripts/image-labels.sh "$name" "$VERSION$sfx")
            docker buildx imagetools create "${args[@]}" "$IMAGE:$sha$sfx"
            digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION$sfx" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "$name=$digest" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$VERSION$sfx → $digest"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: inputs.publish
        with:
          subject-name: ghcr.io/amet13/overfull
          subject-digest: ${{ steps.retag.outputs.full }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: inputs.publish
        with:
          subject-name: ghcr.io/amet13/overfull
          subject-digest: ${{ steps.retag.outputs.check }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: inputs.publish
        with:
          subject-name: ghcr.io/amet13/overfull
          subject-digest: ${{ steps.retag.outputs.slim }}
          push-to-registry: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Creates the tag at this commit when the release comes from Run workflow.
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: assets/*
      - name: "Move the major tag (v3) that `uses: amet13/overfull@v3` reads"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          major="v${VERSION%%.*}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" > /dev/null
          fi
          echo "$major → $GITHUB_SHA"
