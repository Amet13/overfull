name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly on main, so a change outside the repository (runner images, a registry, a
  # TeX Live package) is noticed even without commits; watchdog.yml reports a failure.
  schedule:
    - cron: "23 4 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The automation (autorelease, maintenance) dispatches ci on its own automation/* branch,
# because a pull request opened with GITHUB_TOKEN starts no workflow without a maintainer's
# approval. If that pull_request run is approved anyway, its jobs are skipped: the
# dispatched run already tests the same commit, and a second run only doubles the queue
# for scarce runners (macOS), with a second set of results that can disagree.
jobs:
  node:
    name: Lint, types, unit tests
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'automation/') || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Templates are in sync with skills/ and shared/
        run: pnpm templates:check
      - name: Venue profiles are valid and the generated module is current
        run: pnpm venues:check
      - name: Every eval task and variant can be prepared
        run: node evals/run.mjs --dry-run
      - name: The image pins the same pnpm as packageManager
        run: |
          want="$(jq -r .packageManager package.json)"
          got="pnpm@$(jq -r .dependencies.pnpm docker/pnpm/package.json)"
          [ "$want" = "$got" ] || { echo "::error file=docker/pnpm/package.json::$got, packageManager is $want"; exit 1; }
          jq -e --arg v "${want#pnpm@}" '.packages["node_modules/pnpm"].version == $v' docker/pnpm/package-lock.json > /dev/null
      - name: Version bump script still finds every version
        run: node scripts/bump-version.mjs 99.0.0 --dry-run > /dev/null
      # Dependabot cannot rebuild action/dist; after its PR merges, regenerate.yml opens a
      # PR with the rebuilt bundle. Every other change must commit the rebuilt bundle.
      - name: Bundled Action is up to date
        if: github.actor != 'dependabot[bot]'
        run: |
          pnpm --filter overfull-action build
          git diff --exit-code -- action/dist

  cross-os:
    name: Unit tests (${{ matrix.os }})
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'automation/') || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Keep LF line endings on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm build
      - run: pnpm test
      - name: Standalone CLI runs and creates a project
        shell: bash
        run: |
          node scripts/build-standalone.mjs
          node dist-standalone/overfull.cjs --version
          node dist-standalone/overfull.cjs init paper "$RUNNER_TEMP/sa-paper" --no-git
          test -f "$RUNNER_TEMP/sa-paper/main.tex"
          test -f "$RUNNER_TEMP/sa-paper/.agents/skills/add-citation/SKILL.md"

  changes:
    name: What changed
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'automation/') || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tex: ${{ steps.diff.outputs.tex }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The image jobs build the TeX images and every template. Pull requests that
      # touch only the website or prose skip them; pushes to main always run them.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tex=true
          if [ "$EVENT" = pull_request ]; then
            files="$(git diff --name-only "$BASE...$HEAD")"
            echo "$files"
            if [ -n "$files" ] && ! grep -qvE '^(site/|docs/|evals/|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)' <<< "$files"; then
              tex=false
            fi
          fi
          echo "tex=$tex" >> "$GITHUB_OUTPUT"
          echo "TeX job: $tex"

  # Three images, built in parallel (each reuses the layer cache of image.yml's builds
  # on main, so an unchanged TeX layer is never rebuilt). The CLI is a separate, small
  # layer: a code change rebuilds only that.
  image-full:
    name: Full image, corpus
    needs: changes
    if: needs.changes.outputs.tex == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the full image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: overfull
          load: true
          tags: overfull:ci
          cache-from: type=gha,scope=overfull-linux-amd64
          cache-to: type=gha,scope=overfull-linux-amd64,mode=max
      - name: Corpus reproduces every rule on TeX Live 2026
        run: docker run --rm -v "$PWD:/repo" -w /repo -e OVERFULL_TEX_LOCAL=1 overfull:ci node scripts/corpus.mjs --verify

  image-slim:
    name: Slim image, templates, Action
    needs: changes
    if: needs.changes.outputs.tex == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the slim image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: overfull
          build-args: TEX_FLAVOR=slim
          load: true
          tags: overfull:ci-slim
          cache-from: type=gha,scope=slim-linux-amd64
          cache-to: type=gha,scope=slim-linux-amd64,mode=max
      # The image the template workflow uses: every template must build in it and pass
      # its own preflight (a package missing from the image is installed on demand and
      # named in the log, so the image's package list can be completed).
      - name: Templates build and pass their own preflight in the slim image
        run: bash scripts/e2e-templates.sh overfull:ci-slim out
      - name: The paper template's arXiv build (pdfLaTeX) works in the slim image
        run: docker run --rm -v "$PWD/out/paper:/work" -w /work overfull:ci-slim latexmk -pdf -jobname=paper-arxiv
      - name: Action runs on a built template
        id: action
        uses: ./
        with:
          working-directory: out/thesis
          checks: build,output,references,accessibility,venue
          fail-on: error
      - name: Action reported a status
        run: test -n "${{ steps.action.outputs.status }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: template-pdfs
          path: |
            out/*/*.pdf
            out/*/overfull-report.json
            out/*/overfull-report.html
          if-no-files-found: ignore

  image-check:
    name: Check-only image
    needs: changes
    if: needs.changes.outputs.tex == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the check-only image (no TeX Live)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: check
          load: true
          tags: overfull:ci-check
          cache-from: type=gha,scope=check-linux-amd64
          cache-to: type=gha,scope=check-linux-amd64,mode=max
      - name: The check-only image checks a built project and has no TeX
        run: |
          docker run --rm overfull:ci-check sh -c 'overfull --version && verapdf --version && ! command -v lualatex'
          code=0
          docker run --rm -v "$PWD/packages/cli/test/fixtures/project:/work" -w /work \
            overfull:ci-check overfull check --offline || code=$?
          echo "overfull check exit code: $code"
          test "$code" -le 1

  # image.yml publishes every image for amd64 and arm64. The jobs above test the amd64
  # builds; these build the arm64 ones (natively, with image.yml's layer cache), so a
  # step that breaks only on arm64 fails here, not after the merge.
  image-arm64:
    name: Image (${{ matrix.name }}, arm64)
    needs: changes
    if: needs.changes.outputs.tex == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: full, target: overfull, flavor: full, scope: overfull-linux-arm64 }
          - { name: slim, target: overfull, flavor: slim, scope: slim-linux-arm64 }
          - { name: check, target: check, flavor: full, scope: check-linux-arm64 }
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: TEX_FLAVOR=${{ matrix.flavor }}
          load: true
          tags: overfull:ci-arm64
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,scope=${{ matrix.scope }},mode=max
      - name: The CLI and its tools run
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm overfull:ci-arm64 sh -c 'overfull --version && verapdf --version'
          if [ "$TARGET" = overfull ]; then
            docker run --rm overfull:ci-arm64 sh -c 'lualatex --version | head -1 && latexmk --version | head -2'
          fi

  site:
    name: Website
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'automation/') || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm --filter @overfull/core build
      - run: pnpm --filter site check
      - run: pnpm --filter site build
      # Only the browser, not Ubuntu packages: --with-deps needs the Ubuntu mirrors, and a
      # mirror outage once kept this job hanging for 20 minutes. The runner image already
      # has Chromium's libraries; if a Playwright update needs one more, the next step adds it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter site exec playwright install chromium
        timeout-minutes: 5
      - name: Chromium starts (system libraries present)
        id: chromium
        continue-on-error: true
        timeout-minutes: 2
        working-directory: site
        run: node -e "require('playwright').chromium.launch().then((b) => b.close())"
      - name: Install Chromium's system libraries (only when the check above failed)
        if: steps.chromium.outcome == 'failure'
        timeout-minutes: 10
        run: pnpm --filter site exec playwright install-deps chromium
      - run: pnpm --filter site test:e2e

  installers:
    name: Installers (${{ matrix.os }})
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'automation/') || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh
        if: runner.os != 'Windows'
        run: sh scripts/test-install.sh
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1

  # The one check the main ruleset requires: it passes only when every job above passed
  # or was skipped on purpose, so a pull request cannot be merged while a job is still
  # queued or after one failed.
  passed:
    name: CI passed
    if: always()
    needs: [node, cross-os, changes, image-full, image-slim, image-check, image-arm64, site, installers]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . != "success" and . != "skipped")' <<< "$RESULTS" > /dev/null; then
            echo "::error::A CI job failed or was cancelled."
            exit 1
          fi

  # The automation dispatches this workflow on its automation/* branches with GITHUB_TOKEN,
  # and GitHub starts no workflow_run (automerge, watchdog) when such a run finishes. So
  # the run finishes the job itself: it merges the pull request when everything passed,
  # or keeps one issue open while it fails.
  automation:
    name: Merge or report the automation pull request
    needs: passed
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/heads/automation/')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      issues: write
    steps:
      # The scripts from main, not from the branch under test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: .github/scripts
      - name: Merge, or report the failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PASSED: ${{ needs.passed.result }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Automation failed: ci on $BRANCH"
          : > "$RUNNER_TEMP/body.md"
          if [ "$PASSED" = success ]; then
            bash .github/scripts/issue.sh "$title" "$RUNNER_TEMP/body.md"
            suite="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .check_suite_id)"
            bash .github/scripts/automerge.sh "$BRANCH" "$SHA" "$suite"
            exit 0
          fi
          missed="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .check_run_url' |
            while read -r url; do gh api "${url#https://api.github.com/}/annotations" --jq '.[].message'; done |
            grep -cE 'not acquired by Runner|lost communication with the server' || true)"
          {
            echo "ci failed on \`$BRANCH\`, so its pull request was not merged."
            echo
            echo "Run: $URL"
            if [ "$missed" -gt 0 ]; then
              echo
              echo "A job never got a runner (GitHub capacity): re-run the failed jobs."
            fi
            echo
            echo "This issue closes itself when ci next passes on the branch."
          } > "$RUNNER_TEMP/body.md"
          bash .github/scripts/issue.sh "$title" "$RUNNER_TEMP/body.md"
