# Opens one issue per workflow when a run on main (or a scheduled or automation run)
# fails, so a broken update, image build, release or benchmark is not missed; closes it
# when the same workflow next succeeds there. Runs on pull requests are not reported:
# their authors see them.
name: watchdog

on:
  workflow_run:
    workflows:
      - ci
      - codeql
      - image
      - pages
      - release
      - regenerate
      - maintenance
      - autorelease
      - automerge
      - OpenSSF Scorecard
    types: [completed]

permissions:
  contents: read

jobs:
  # A job that GitHub could not give a runner (macOS capacity, a lost runner) never ran
  # the code, so it says nothing about the change. Such a run is re-run once, failed jobs
  # only; a job that ran and failed is never re-run, and a second miss is reported.
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["ci","image","release"]'), github.event.workflow_run.name)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
    steps:
      - name: Re-run jobs that never got a runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          missed=""
          for url in $(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/1/jobs?per_page=100" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .check_run_url'); do
            if gh api "${url#https://api.github.com/}/annotations" --jq '.[].message' |
                grep -qE 'not acquired by Runner|lost communication with the server'; then
              missed=1
            fi
          done
          if [ -z "$missed" ]; then echo "Every failed job ran: nothing to re-run."; exit 0; fi
          gh run rerun "$RUN_ID" --failed
          echo "A job never got a runner; re-running the failed jobs once."

  report:
    # Only conclusions that open or close an issue start a runner (most automerge runs are
    # skipped, and cancelled runs say nothing).
    if: >-
      contains(fromJSON('["failure","timed_out","startup_failure","success"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.event != 'pull_request' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.event == 'schedule' ||
       startsWith(github.event.workflow_run.head_branch, 'automation/'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          : > "$RUNNER_TEMP/body.md"
          case "$CONCLUSION" in
            failure|timed_out|startup_failure)
              {
                echo "The **$NAME** workflow failed ($EVENT on \`$BRANCH\`)."
                echo
                echo "Run: $URL"
                echo
                echo "This issue closes itself when $NAME next succeeds."
              } > "$RUNNER_TEMP/body.md" ;;
            success) ;;
            *) echo "Conclusion $CONCLUSION: nothing to do."; exit 0 ;;
          esac
          bash .github/scripts/issue.sh "Automation failed: $NAME" "$RUNNER_TEMP/body.md"
